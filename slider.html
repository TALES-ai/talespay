<div class="slider-container" style="position: relative; width: 100%; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.1);">
  <div class="slides" style="position: relative; height: 200px;">
    <!-- Slide 1 -->
    <div class="slide" style="position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.5s ease-in-out; background-image: url('1.png'); background-size: cover; background-position: center;">
      <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, rgba(19,41,75,0.4) 0%, rgba(0,0,0,0.2) 100%);"></div>
    </div>
    
    <!-- Slide 2 -->
    <div class="slide" style="position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.5s ease-in-out; background-image: url('2.png'); background-size: cover; background-position: center;">
      <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, rgba(19,41,75,0.4) 0%, rgba(0,0,0,0.2) 100%);"></div>
    </div>
    
    <!-- Slide 3 -->
    <div class="slide" style="position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.5s ease-in-out; background-image: url('3.png'); background-size: cover; background-position: center;">
      <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, rgba(19,41,75,0.4) 0%, rgba(0,0,0,0.2) 100%);"></div>
    </div>
    
    <!-- Slide 4 -->
    <div class="slide" style="position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.5s ease-in-out; background-image: url('4.png'); background-size: cover; background-position: center;">
      <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, rgba(19,41,75,0.4) 0%, rgba(0,0,0,0.2) 100%);"></div>
    </div>
  </div>
  
  <!-- Slider indicators -->
  <div style="position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.5rem; z-index: 10;">
    <div class="indicator" style="width: 30px; height: 4px; background: white; border-radius: 4px; opacity: 0.5; cursor: pointer;"></div>
    <div class="indicator" style="width: 30px; height: 4px; background: white; border-radius: 4px; opacity: 0.5; cursor: pointer;"></div>
    <div class="indicator" style="width: 30px; height: 4px; background: white; border-radius: 4px; opacity: 0.5; cursor: pointer;"></div>
    <div class="indicator" style="width: 30px; height: 4px; background: white; border-radius: 4px; opacity: 0.5; cursor: pointer;"></div>
  </div>
</div>

<style>
  .slide.active { opacity: 1 !important; }
  .indicator.active { opacity: 1 !important; }
</style>

<script>
  // Initialize slider immediately
  (function() {
    function initSlider() {
      const slides = document.querySelectorAll('.slide');
      const indicators = document.querySelectorAll('.indicator');
      
      if (!slides.length) {
        setTimeout(initSlider, 100);
        return;
      }
      
      let currentSlide = 0;
      
      // Set first slide as active
      slides[currentSlide].classList.add('active');
      if (indicators.length) indicators[currentSlide].classList.add('active');
      
      // Auto advance slides
      setInterval(() => {
        // Remove active from current
        slides[currentSlide].classList.remove('active');
        if (indicators.length) indicators[currentSlide].classList.remove('active');
        
        // Move to next slide
        currentSlide = (currentSlide + 1) % slides.length;
        
        // Add active to new slide
        slides[currentSlide].classList.add('active');
        if (indicators.length) indicators[currentSlide].classList.add('active');
      }, 5000);
      
      // Add click handlers to indicators
      indicators.forEach((indicator, index) => {
        indicator.addEventListener('click', () => {
          // Remove active from current
          slides[currentSlide].classList.remove('active');
          indicators[currentSlide].classList.remove('active');
          
          // Set new current
          currentSlide = index;
          
          // Add active to new
          slides[currentSlide].classList.add('active');
          indicators[currentSlide].classList.add('active');
        });
      });
    }
    
    // Run when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSlider);
    } else {
      initSlider();
    }
  })();
</script>
